name: Publish Container Image

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to publish (for example 1.1.0)'
        required: true
        type: string
      push_latest:
        description: 'Also publish latest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lineage-scaffold-advisory:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify lineage scaffold (advisory)
        id: lineage_check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/verify-lineage-scaffold.sh
          scripts/verify-lineage-scaffold.sh

      - name: Report advisory status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.lineage_check.outcome }}" == "success" ]]; then
            echo "Lineage scaffold advisory check passed."
          else
            echo "Lineage scaffold advisory check failed; this is currently non-blocking." >&2
          fi

  verify-build:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build verification image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t panpreposterous:ci-verify -f Dockerfile .

      - name: Verify wrapper help
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm panpreposterous:ci-verify panpreposterous --help

      - name: Verify help sections
        shell: bash
        run: |
          set -euo pipefail
          help_output="$(docker run --rm panpreposterous:ci-verify panpreposterous --help)"
          printf '%s\n' "$help_output" | grep -q '^Usage:'
          printf '%s\n' "$help_output" | grep -q '^Defaults:'
          printf '%s\n' "$help_output" | grep -q '^Example:'

      - name: Verify runtime asset paths
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm panpreposterous:ci-verify sh -lc '
            set -eu
            test -r "$PANPREPOSTEROUS_TEMPLATE_PATH"
            test -r "$PANPREPOSTEROUS_BACKMATTER_FILTER_PATH"
            test -r "$PANPREPOSTEROUS_SUPPLEMENTARY_FILTER_PATH"
          '

      - name: Render bundled example
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          cp examples/manuscript.md "$smoke_dir"/
          cp examples/references.bib "$smoke_dir"/
          cp examples/journal.csl "$smoke_dir"/
          cp -R examples/figs "$smoke_dir"/
          cp -R examples/tables "$smoke_dir"/
          docker run --rm -v "$smoke_dir":/work panpreposterous:ci-verify \
            panpreposterous manuscript.md --bibliography references.bib --csl journal.csl -o smoke-render.pdf
          test -s "$smoke_dir/smoke-render.pdf"

  publish:
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify-build
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/costantinicarlo/panpreposterous
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve tag strategy
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            push_latest="true"
          else
            version="${{ github.event.inputs.image_tag }}"
            push_latest="${{ github.event.inputs.push_latest }}"
          fi

          if [[ -z "$version" ]]; then
            echo "Version tag is required." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push_latest=$push_latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate OCI labels and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=panpreposterous
            org.opencontainers.image.description=Pandoc + XeLaTeX container for reproducible preprint/postprint PDFs
            org.opencontainers.image.licenses=CC-BY-4.0

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}